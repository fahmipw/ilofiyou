<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lofi Chill</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M3 18v-6a9 9 0 0 1 18 0v6' fill='none' stroke='%23f2a65a' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:#fff;user-select:none;
}
/* ======== VIDEO BACKGROUND ======== */
#bgwrap{position:fixed;inset:0;z-index:0;overflow:hidden;background:#0e0c16}
.bgvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .55s ease}
.bgvid.on{opacity:1}

/* ======== VIDEO BG / OVERLAYS ======== */
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;display:none}
#vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(10,8,18,.42) 100%)}


/* ======== HEADER ======== */
header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;
  align-items:center;padding:16px 22px}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer}
.logo svg{width:30px;height:30px}
.logo span{font-family:"Segoe Script","Brush Script MT","Comic Sans MS",cursive;
  font-size:30px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.h-right{display:flex;align-items:center;gap:10px}
.h-right a{display:flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:15px;
  text-shadow:0 1px 6px rgba(0,0,0,.5);padding:8px 10px;border-radius:10px}
.h-right a:hover{background:rgba(255,255,255,.14)}
.h-right a svg{width:22px;height:22px}
.icon-btn{background:rgba(20,16,28,.45);border:1px solid rgba(255,255,255,.25);color:#fff;
  width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;backdrop-filter:blur(6px);transition:transform .15s,background .2s}
.icon-btn:hover{background:rgba(20,16,28,.7);transform:scale(1.06)}
.icon-btn svg{width:22px;height:22px}
/* ======== SIANG / MALAM SEGMENTED CONTROL ======== */
.seg{display:flex;background:rgba(20,16,28,.45);border:1px solid rgba(255,255,255,.25);
  border-radius:999px;padding:3px;backdrop-filter:blur(6px)}
.seg button{border:none;background:none;color:#fff;font-size:13px;padding:7px 12px;
  border-radius:999px;cursor:pointer;opacity:.7;transition:all .2s;white-space:nowrap}
.seg button.on{background:#f2a65a;color:#1c1410;opacity:1;font-weight:600}

/* ======== SIDE CONTROLS ======== */
#rainBtn{position:fixed;right:24px;top:38%;z-index:10;background:#fff;border:none;
  width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.35);transition:transform .15s}
#rainBtn:hover{transform:scale(1.08)}
#rainBtn svg{width:28px;height:28px}
#rainBtn.active{background:#7fb2e8}
#pill{position:fixed;right:24px;top:calc(38% + 66px);z-index:10;background:rgba(18,16,26,.72);
  border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:10px 0;display:flex;
  flex-direction:column;gap:6px;backdrop-filter:blur(8px)}
#pill button{background:none;border:none;color:#fff;width:52px;height:46px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
#pill button:hover{background:rgba(255,255,255,.12)}
#pill button.active{background:rgba(242,166,90,.28);color:#f2a65a}
#pill svg{width:24px;height:24px}

/* ======== PANELS ======== */
.panel{position:fixed;right:94px;top:50%;transform:translateY(-50%) scale(.96);z-index:20;
  width:304px;max-height:82vh;overflow-y:auto;background:rgba(18,16,26,.82);
  border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:18px;
  backdrop-filter:blur(12px);box-shadow:0 12px 40px rgba(0,0,0,.45);
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s}
.panel.open{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:3px}
.p-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.p-head h3{font-size:17px;font-weight:600;letter-spacing:.3px}
.p-close{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;opacity:.7;line-height:1}
.p-close:hover{opacity:1}
.panel h3.sec{font-size:16px;margin:16px 0 10px;font-weight:600}
.moods{display:flex;gap:8px}
.mood{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.22);
  border-radius:12px;color:#fff;padding:10px 4px;display:flex;flex-direction:column;
  align-items:center;gap:6px;cursor:pointer;font-size:12px;transition:all .18s}
.mood svg{width:22px;height:22px}
.mood.active{border-color:#f2a65a;color:#f2a65a;background:rgba(242,166,90,.12)}
.vol-row{display:flex;align-items:center;gap:10px;margin-top:14px}
.vol-row svg{width:20px;height:20px;flex:none;opacity:.85}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:5px;border-radius:3px;
  background:rgba(255,255,255,.28);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:#f2a65a;box-shadow:0 1px 6px rgba(0,0,0,.4);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:none;border-radius:50%;background:#f2a65a}
.amb-row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.amb-row label{flex:0 0 108px;font-size:13px;opacity:.92}

/* ======== FOCUS PANEL ======== */
.timer-inputs{display:flex;gap:8px;align-items:flex-end}
.timer-inputs .fld{flex:1;display:flex;flex-direction:column;gap:4px}
.timer-inputs label{font-size:11px;opacity:.7}
.timer-inputs input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  border-radius:10px;color:#fff;font-size:16px;padding:8px 4px;text-align:center;width:100%;outline:none}
.btn{background:#3b82f6;border:none;color:#fff;border-radius:10px;padding:9px 14px;
  font-size:14px;cursor:pointer;transition:background .18s;white-space:nowrap}
.btn:hover{background:#2f6fe0}
.btn.ghost{background:rgba(255,255,255,.12)}
.btn.ghost:hover{background:rgba(255,255,255,.2)}
#timerDisplay{font-size:36px;text-align:center;margin:14px 0 8px;font-variant-numeric:tabular-nums;
  letter-spacing:2px;font-weight:300}
#timerMsg{text-align:center;font-size:14px;color:#f2a65a;min-height:20px;margin-bottom:4px}
.todo-add{display:flex;gap:8px;margin-bottom:10px}
.todo-add input{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  border-radius:10px;color:#fff;font-size:14px;padding:9px 12px;outline:none}
.todo-add input::placeholder{color:rgba(255,255,255,.45)}
#todoList{list-style:none}
#todoList li{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);
  border-radius:10px;padding:9px 10px;margin-bottom:8px;font-size:14px}
#todoList li.done span{text-decoration:line-through;opacity:.55}
#todoList input[type=checkbox]{width:17px;height:17px;accent-color:#f2a65a;cursor:pointer;flex:none}
#todoList li span{flex:1;word-break:break-word}
#todoList .del{background:none;border:none;color:#ff8a8a;font-size:18px;cursor:pointer;opacity:.7}
#todoList .del:hover{opacity:1}
#todoEmpty{text-align:center;opacity:.5;font-size:14px;padding:14px 0}

/* ======== PLAYLIST ======== */
#plList{list-style:none}
#plList li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
  cursor:pointer;font-size:14px;margin-bottom:6px;background:rgba(255,255,255,.05);
  border:1px solid transparent;transition:all .18s}
#plList li:hover{background:rgba(255,255,255,.1)}
#plList li.on{border-color:#f2a65a;background:rgba(242,166,90,.12);color:#f2a65a}
#plList .num{flex:none;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.14);
  font-size:11px;display:flex;align-items:center;justify-content:center}
#plList li.on .num{background:#f2a65a;color:#1c1410}
#plList .ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#plList .eq{flex:none;display:none;align-items:flex-end;gap:2px;height:14px}
#plList li.on .eq{display:flex}
#plList .eq i{width:3px;background:#f2a65a;animation:eqb .9s ease-in-out infinite}
#plList .eq i:nth-child(2){animation-delay:.2s}
#plList .eq i:nth-child(3){animation-delay:.4s}
@keyframes eqb{0%,100%{height:5px}50%{height:14px}}

/* ======== YOUTUBE PLAYLIST ======== */
.yt-note{font-size:12px;opacity:.75;line-height:1.5;margin:2px 0 10px}
.yt-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-bottom:10px}
.yt-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#ytPlayBtn,#ytStopBtn{width:100%;margin-bottom:10px}
#ytList{list-style:none}
#ytList li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;cursor:pointer;font-size:13px;margin-bottom:6px;background:rgba(255,255,255,.05);transition:background .18s}
#ytList li:hover{background:rgba(255,255,255,.1)}
#ytList .num{flex:none;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.14);font-size:11px;display:flex;align-items:center;justify-content:center}
#ytList .ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yt-link{display:inline-block;margin-top:4px;font-size:13px;color:#f2a65a;text-decoration:none}
.yt-divider{border:none;border-top:1px solid rgba(255,255,255,.16);margin:18px 0 4px}

/* ======== MP3 PLAYLIST ======== */
#mpList,#mpList2{list-style:none}
#mpList li,#mpList2 li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
  cursor:pointer;font-size:14px;margin-bottom:6px;background:rgba(255,255,255,.05);
  border:1px solid transparent;transition:all .18s}
#mpList li:hover,#mpList2 li:hover{background:rgba(255,255,255,.1)}
#mpList li.on,#mpList2 li.on{border-color:#f2a65a;background:rgba(242,166,90,.12);color:#f2a65a}
#mpList .num,#mpList2 .num{flex:none;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.14);
  font-size:11px;display:flex;align-items:center;justify-content:center}
#mpList li.on .num,#mpList2 li.on .num{background:#f2a65a;color:#1c1410}
#mpList .ttl,#mpList2 .ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ======== BOTTOM BAR ======== */
#bottombar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;align-items:center;
  justify-content:space-between;padding:14px 26px 20px}
#bottombar .song{font-size:15px;text-shadow:0 1px 8px rgba(0,0,0,.6);max-width:30%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bottombar .song span{opacity:.85}
.controls{display:flex;align-items:center;gap:18px}
.controls button{background:none;border:none;color:#fff;cursor:pointer;display:flex;
  align-items:center;justify-content:center;transition:transform .15s;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.controls button:hover{transform:scale(1.12)}
.controls svg{width:26px;height:26px}
#playBtn{width:62px;height:62px;border:2px solid #fff;border-radius:50%}
#playBtn svg{width:26px;height:26px;margin-left:2px}
#playBtn.playing svg{margin-left:0}
.credit{font-size:14px;text-shadow:0 1px 8px rgba(0,0,0,.6);max-width:30%;text-align:right}
.credit b{font-weight:600}
#hint{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:10;
  background:rgba(18,16,26,.8);border:1px solid rgba(255,255,255,.18);padding:10px 18px;
  border-radius:999px;font-size:14px;backdrop-filter:blur(8px);transition:opacity .5s;
  text-shadow:none;white-space:nowrap}
#hint.hide{opacity:0;pointer-events:none}

.noweq{display:inline-flex;align-items:flex-end;gap:2px;height:16px;margin-left:8px;vertical-align:middle;opacity:0;transition:opacity .25s}
.noweq.on{opacity:1}
.noweq i{width:3px;background:#f2a65a;border-radius:2px;animation:eqb .9s ease-in-out infinite;height:5px}
.noweq i:nth-child(2){animation-delay:.15s}
.noweq i:nth-child(3){animation-delay:.3s}
.noweq i:nth-child(4){animation-delay:.45s}

.homeviz{position:fixed;left:50%;bottom:16%;transform:translateX(-50%);z-index:5;display:flex;align-items:flex-end;gap:6px;height:60px;pointer-events:none;opacity:0;transition:opacity .5s}
.homeviz.on{opacity:.9}
.homeviz span{width:6px;background:linear-gradient(180deg,#f2a65a,rgba(242,166,90,.25));border-radius:3px;animation:homebar 1.1s ease-in-out infinite;height:10px}
.homeviz span:nth-child(2){animation-delay:.1s}
.homeviz span:nth-child(3){animation-delay:.2s}
.homeviz span:nth-child(4){animation-delay:.3s}
.homeviz span:nth-child(5){animation-delay:.4s}
.homeviz span:nth-child(6){animation-delay:.5s}
.homeviz span:nth-child(7){animation-delay:.6s}
.homeviz span:nth-child(8){animation-delay:.7s}
@keyframes homebar{0%,100%{height:8px}50%{height:58px}}

@media (max-width:680px){
  .logo span{font-size:24px}
  .h-right a span{display:none}
  #bottombar{padding:10px 14px 16px}
  #bottombar .song{font-size:12px;max-width:26%}
  .credit{font-size:11px;max-width:26%}
  .controls{gap:12px}
  #playBtn{width:54px;height:54px}
  #rainBtn{right:14px}
  #pill{right:14px}
  .panel{right:12px;left:12px;width:auto;top:auto;bottom:86px;transform:translateY(12px);
    max-height:48vh}
  .panel.open{transform:translateY(0)}
  #hint{font-size:12px;bottom:88px}
}
</style>
</head>
<body>

<!-- ================= VIDEO BACKGROUND ================= -->
<div id="bgwrap">
  <video id="vidSiang" class="bgvid" data-src="siang.webm" preload="none" muted loop playsinline></video>
  <video id="vidMalam" class="bgvid" data-src="malam.webm" preload="none" muted loop playsinline></video>
  <video id="vidHujan" class="bgvid" data-src="hujan.webm" preload="none" muted loop playsinline></video>
</div>
<div id="vignette"></div>

<!-- ================= HEADER ================= -->
<header>
  <div class="logo" id="logoBtn" title="Lofi Chill">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
    <span>lofi</span>
  </div>
  <div class="h-right">
    <a href="https://github.com/fahmipw" target="_blank" rel="noopener" title="GitHub">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55v-2.15c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.7 1.25 3.35.96.11-.75.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.76.11 3.05.74.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.25 5.67.41.35.77 1.05.77 2.12v3.15c0 .3.21.66.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
      <span>GitHub</span>
    </a>
    <div class="seg" id="modeSeg" title="Mode siang / malam">
      <button data-mode="siang">&#9728; Siang</button>
      <button data-mode="malam">&#127769; Malam</button>
    </div>
    <button class="icon-btn" id="fsBtn" title="Layar penuh">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
  </div>
</header>

<!-- ================= SIDE CONTROLS ================= -->
<button id="rainBtn" title="Suara hujan">
  <svg viewBox="0 0 24 24" fill="none" stroke="#4a6fa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15.5a4.5 4.5 0 0 0-1.6-8.7 6.5 6.5 0 0 0-12.7 1.6A4 4 0 0 0 7 16.5"/><path d="M8 18v2.5M12 18v2.5M16 18v2.5"/></svg>
</button>
<div id="pill">
  <button id="mixerBtn" title="Mixer suara">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h10M18 8h2M4 16h4M12 16h8"/><circle cx="16" cy="8" r="2.2"/><circle cx="10" cy="16" r="2.2"/></svg>
  </button>
  <button id="focusBtn" title="Mode fokus &amp; tugas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
  </button>
  <button id="listBtn" title="Playlist">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h11M4 10h11M4 14h6"/><circle cx="17.5" cy="17.5" r="2.5"/><path d="M20 17.5V7l-3.5-1.2"/></svg>
  </button>
</div>

<!-- ================= MIXER PANEL ================= -->
<div class="panel" id="mixerPanel">
  <div class="p-head"><h3>Suasana</h3><button class="p-close" data-close="mixerPanel">&times;</button></div>
  <div class="moods">
    <button class="mood" data-mood="sleep">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span>Tidur</span>
    </button>
    <button class="mood" data-mood="jazzy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span>Jazzy</span>
    </button>
    <button class="mood active" data-mood="chill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1M3 8h14v6a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V8z"/><path d="M7 2v2M11 2v2M15 2v2"/></svg>
      <span>Santai</span>
    </button>
  </div>
  <div class="vol-row">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/></svg>
    <input type="range" id="masterVol" min="0" max="100" value="50">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9.5 9.5 0 0 1 0 13"/></svg>
  </div>
  <h3 class="sec">Suara Latar</h3>
  <div id="ambList"></div>
</div>

<!-- ================= FOCUS PANEL ================= -->
<div class="panel" id="focusPanel">
  <div class="p-head"><h3>Mode Fokus</h3><button class="p-close" data-close="focusPanel">&times;</button></div>
  <div class="timer-inputs">

<script>
"use strict";
/* ================= AUDIO CORE ================= */
let AC=null, master, moodFilter, musicBus, ambBus, delaySend;
let noiseWhite=null, noiseBrown=null;

function audio(){
  if(!AC){
    const Ctx=window.AudioContext||window.webkitAudioContext;
    AC=new Ctx();
    master=AC.createGain(); master.gain.value=0.5;
    moodFilter=AC.createBiquadFilter(); moodFilter.type='lowpass'; moodFilter.frequency.value=16000;
    musicBus=AC.createGain(); musicBus.gain.value=0.9;
    ambBus=AC.createGain(); ambBus.gain.value=1.0;
    musicBus.connect(moodFilter); ambBus.connect(moodFilter);
    moodFilter.connect(master); master.connect(AC.destination);
    const dly=AC.createDelay(1); dly.delayTime.value=0.34;
    const fb=AC.createGain(); fb.gain.value=0.36;
    const wet=AC.createGain(); wet.gain.value=0.3;
    delaySend=AC.createGain();
    delaySend.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(musicBus);
    noiseWhite=makeNoise(2,'white'); noiseBrown=makeNoise(3,'brown');
  }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function makeNoise(sec,type){
  const len=Math.floor(AC.sampleRate*sec);
  const buf=AC.createBuffer(1,len,AC.sampleRate);
  const d=buf.getChannelData(0);
  let last=0;
  for(let i=0;i<len;i++){
    const w=Math.random()*2-1;
    if(type==='white') d[i]=w;
    else { last=(last+0.02*w)/1.02; d[i]=last*3.2; }
  }
  return buf;
}
const SEMI={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function nf(n){
  const m=/^([A-G][#b]?)(\d)$/.exec(n);
  const midi=SEMI[m[1]]+(parseInt(m[2],10)+1)*12;
  return 440*Math.pow(2,(midi-69)/12);
}
function env(g,t,a,peak,dec){
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002),t+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);
}
function filt(type,freq,q){
  const f=AC.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q||0.7; return f;
}
function wob(param,rate,depth){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine'; o.frequency.value=rate; g.gain.value=depth;
  o.connect(g); g.connect(param); o.start();
}
function loopSrc(type){
  const s=AC.createBufferSource();
  s.buffer=(type==='brown')?noiseBrown:noiseWhite;
  s.loop=true; return s;
}

/* ================= INSTRUMENTS ================= */
function rhodes(f,t,dur,vol){
  const o1=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),lp=filt('lowpass',1500,0.5),g2=AC.createGain();
  o1.type='triangle'; o1.frequency.value=f;
  o2.type='sine'; o2.frequency.value=f*2.005; g2.gain.value=0.25;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(musicBus);
  env(g,t,0.008,vol,dur);
  o1.start(t); o2.start(t); o1.stop(t+dur+0.3); o2.stop(t+dur+0.3);
}
function bassN(f,t,dur,vol){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(musicBus);
  env(g,t,0.01,vol,dur);
  o.start(t); o.stop(t+dur+0.3);
}
function kick(t,vol){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(150,t);
  o.frequency.exponentialRampToValueAtTime(42,t+0.11);
  o.connect(g); g.connect(musicBus);
  env(g,t,0.003,vol,0.22);
  o.start(t); o.stop(t+0.35);
}
function snare(t,vol){
  const s=loopSrc('white'),bp=filt('bandpass',1900,0.9),g=AC.createGain();
  s.connect(bp); bp.connect(g); g.connect(musicBus);
  env(g,t,0.002,vol,0.16);
  s.start(t); s.stop(t+0.3);
  const o=AC.createOscillator(),g2=AC.createGain();
  o.type='triangle'; o.frequency.value=190; o.connect(g2); g2.connect(musicBus);
  env(g2,t,0.002,vol*0.5,0.09);
  o.start(t); o.stop(t+0.2);
}
function hat(t,vol,open){
  const s=loopSrc('white'),hp=filt('highpass',7600,0.7),g=AC.createGain();
  s.connect(hp); hp.connect(g); g.connect(musicBus);
  env(g,t,0.001,vol,open?0.3:0.045);
  s.start(t); s.stop(t+(open?0.45:0.12));
}
function pluck(f,t,vol){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='triangle'; o.frequency.value=f;
  o.connect(g); g.connect(musicBus); g.connect(delaySend);
  env(g,t,0.005,vol,0.5);
  o.start(t); o.stop(t+0.8);
}
let vinylS=null;
function startVinyl(){
  if(vinylS) return;
  const len=Math.floor(AC.sampleRate*2);
  const buf=AC.createBuffer(1,len,AC.sampleRate);
  const d=buf.getChannelData(0);
  let last=0;
  for(let i=0;i<len;i++){
    const w=Math.random()*2-1;
    last=(last+0.02*w)/1.02;
    d[i]=last*0.5+(Math.random()<0.0006?(Math.random()*2-1)*0.5:0);
  }
  const s=AC.createBufferSource(); s.buffer=buf; s.loop=true;
  const lp=filt('lowpass',4200,0.5), g=AC.createGain(); g.gain.value=0.32;
  s.connect(lp); lp.connect(g); g.connect(musicBus);
  s.start(); vinylS=s;
}
function stopVinyl(){
  if(vinylS){ try{vinylS.stop();}catch(e){} try{vinylS.disconnect();}catch(e){} vinylS=null; }
}

/* ================= LOFI SEQUENCER ================= */
const TRACKS=[
  {name:'Kopi Tengah Malam',bpm:76,
   chords:[['A2','E3','G3','B3','C4'],['F2','C3','E3','G3','A3'],['C3','G3','B3','D4','E4'],['G2','D3','G3','B3','D4']],
   roots:['A1','F1','C2','G1'],
   penta:['A3','C4','D4','E4','G4','A4','C5']},
  {name:'Jendela Hujan',bpm:64,
   chords:[['D3','A3','C4','E4','F4'],['Bb2','F3','A3','C4','D4'],['F2','C3','E3','G3','A3'],['C3','G3','B3','E4','G4']],
   roots:['D2','Bb1','F1','C2'],
   penta:['D4','F4','G4','A4','C5','D5']},
  {name:'Pagi yang Pelan',bpm:88,
   chords:[['C3','G3','B3','D4','E4'],['A2','E3','G3','C4','E4'],['D3','A3','C4','F4','A4'],['G2','D3','F3','B3','E4']],
   roots:['C2','A1','D2','G1'],
   penta:['C4','D4','E4','G4','A4','C5','D5']},
  {name:'Senja di Kamar',bpm:72,
   chords:[['A2','E3','A3','C4','E4'],['F2','C3','F3','A3','C4'],['C3','G3','C4','E4','G4'],['G2','D3','G3','B3','D4']],
   roots:['A1','F1','C2','G1'],
   penta:['A3','C4','D4','E4','G4','A4','C5']},
  {name:'Rintik Hujan',bpm:68,
   chords:[['E3','B3','D4','G4','A4'],['C3','G3','B3','E4','G4'],['G2','D3','G3','B3','E4'],['D3','A3','D4','F4','A4']],
   roots:['E2','C2','G1','D2'],
   penta:['E4','G4','A4','B4','D5','E5']},
  {name:'Malam Minggu',bpm:80,
   chords:[['G2','D3','G3','B3','D4'],['E2','B2','E3','G3','B3'],['C3','G3','C4','E4','G4'],['D3','A3','D4','F4','A4']],
   roots:['G1','E1','C2','D2'],
   penta:['G3','A3','B3','D4','E4','G4','A4']}
];
const MOODS={
  chill:{filter:16000,mul:1,   hat:true, mel:0.42, vol:1},
  jazzy:{filter:18000,mul:1.12,hat:true, mel:0.60, vol:1},
  sleep:{filter:1100, mul:0.85,hat:false,mel:0.18, vol:0.8}
};
let playing=false, trackIdx=0, step=0, nextT=0, schedTimer=null, mood='chill';
function bpm(){ return TRACKS[trackIdx].bpm*MOODS[mood].mul; }
function setMood(m){
  mood=m;
  document.querySelectorAll('.mood').forEach(b=>b.classList.toggle('active',b.dataset.mood===m));
  if(AC) moodFilter.frequency.setTargetAtTime(MOODS[m].filter,AC.currentTime,0.4);
}
function scheduleStep(s,t){
  const tr=TRACKS[trackIdx], M=MOODS[mood];
  const bar=Math.floor(s/16)%4, st=s%16;
  const chord=tr.chords[bar];
  if(st===0) chord.forEach(n=>rhodes(nf(n),t,2.2,0.16*M.vol));
  if(st===10) chord.slice(-3).forEach(n=>rhodes(nf(n),t,1.2,0.09*M.vol));
  if(mood==='jazzy'&&st===7) chord.slice(1,4).forEach(n=>rhodes(nf(n),t,0.8,0.07));
  if(st===0) bassN(nf(tr.roots[bar]),t,1.8,0.22*M.vol);
  if(st===8) bassN(nf(tr.roots[bar]),t,1.2,0.16*M.vol);
  if(mood==='jazzy'&&st===14) bassN(nf(tr.roots[(bar+1)%4]),t,0.8,0.14);
  if(st===0||st===10) kick(t,0.5*M.vol);
  if(st===4||st===12) snare(t,0.32*M.vol);
  if(M.hat&&st%2===0) hat(t,0.10*M.vol,false);
  if(M.hat&&st===14&&Math.random()<0.3) hat(t,0.08*M.vol,true);
  if(st%2===0&&Math.random()<M.mel){
    const p=tr.penta[Math.floor(Math.random()*tr.penta.length)];
    pluck(nf(p),t,0.11*M.vol);
  }
}
function scheduler(){
  const spb=60/bpm()/4;
  while(nextT<AC.currentTime+0.3){
    let t=nextT;
    if(step%2===1) t+=spb*0.28;
    scheduleStep(step,t);
    nextT+=spb; step=(step+1)%64;
  }
}
function setPlaying(p){
  if(window.__mp3Stop) window.__mp3Stop();
  audio();
  playing=p;
  const btn=document.getElementById('playBtn'), ico=document.getElementById('playIco');
  const eq=document.getElementById('nowEq');
  const viz=document.getElementById('homeViz');
  if(p){
    startVinyl();
    step=0; nextT=AC.currentTime+0.1;
    schedTimer=setInterval(scheduler,90);
    ico.innerHTML='<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
    btn.classList.add('playing');
    if(eq) eq.classList.add('on');
    if(viz) viz.classList.add('on');
    document.getElementById('hint').classList.add('hide');
  }else{
    clearInterval(schedTimer); schedTimer=null;
    stopVinyl();
    ico.innerHTML='<path d="M8 5v14l11-7z"/>';
    btn.classList.remove('playing');
    if(eq) eq.classList.remove('on');
    if(viz) viz.classList.remove('on');
  }
}
function setTrack(i){
  if(window.__ytStop) window.__ytStop();
  if(window.__mp3Stop) window.__mp3Stop();
  trackIdx=(i+TRACKS.length)%TRACKS.length;
  document.getElementById('songName').textContent=TRACKS[trackIdx].name;
  if(typeof renderPlaylist==='function') renderPlaylist();

}

/* ================= AMBIENT NOISES ================= */
const ambState={};
function ambGain(key){
  if(!ambState[key]){
    const g=AC.createGain(); g.gain.value=0; g.connect(ambBus);
    ambState[key]={gain:g,nodes:[],built:false,val:0};
  }
  return ambState[key];
}
function chain(key,buildFn){
  const st=ambGain(key);
  if(!st.built){ st.built=true; buildFn(st); st.nodes.forEach(n=>{try{n.start();}catch(e){}}); }
}
function rainChain(dest){
  const s=loopSrc('white'),bp=filt('bandpass',2600,0.4),lp=filt('lowpass',6500,0.5),g=AC.createGain();
  g.gain.value=0.5;
  s.connect(bp); bp.connect(lp); lp.connect(g); g.connect(dest);
  wob(g.gain,0.11,0.15);
  return [s];
}
const AMBIENTS=[
  ['rain','Hujan',st=>{ st.nodes.push(...rainChain(st.gain)); }],

    s.connect(f); f.connect(g); g.connect(st.gain); st.nodes.push(s);
  }],
  ['traffic','Lalu Lintas',st=>{
    const s=loopSrc('brown'),f=filt('lowpass',380,0.5),g=AC.createGain(); g.gain.value=0.55;
    s.connect(f); f.connect(g); g.connect(st.gain);

  ['fireplace','Perapian',st=>{

      if(Math.random()<0.55){

  ['snow','Salju',st=>{
    const s=loopSrc('white'),f=filt('highpass',5800,0.7),g=AC.createGain(); g.gain.value=0.1;
    s.connect(f); f.connect(g); g.connect(st.gain);
    wob(g.gain,0.07,0.04);
    st.nodes.push(s);
  }],
  ['storm','Badai',st=>{
    const s=loopSrc('brown'),f=filt('lowpass',120,0.5),g=AC.createGain(); g.gain.value=0.8;

  ['wave','Ombak',st=>{

    s.connect(f); f.connect(g); g.connect(st.gain);
    wob(f.frequency,0.05,220); wob(g.gain,0.07,0.22);
    st.nodes.push(s);
  }],
  ['people','Keramaian',st=>{
    const s=loopSrc('brown'),f=filt('bandpass',1100,0.5),g=AC.createGain(); g.gain.value=0.32;
    s.connect(f); f.connect(g); g.connect(st.gain);
    wob(g.gain,0.13,0.12); wob(g.gain,0.31,0.07);
    const s2=loopSrc('white'),f2=filt('bandpass',2600,0.7),g2=AC.createGain(); g2.gain.value=0.05;
    s2.connect(f2); f2.connect(g2); g2.connect(st.gain);

  ['river','Sungai',st=>{

      o.connect(og); og.connect(st.gain);
      env(og,t,0.03,0.09,0.32);
      o.start(t); o.stop(t+0.5);
      st.to=setTimeout(bird,2500+Math.random()*5000);
    };
    st.to=setTimeout(bird,2000);
  }]
];
function setAmbient(key,val){
  audio();
  const st=ambGain(key);
  const def=AMBIENTS.find(a=>a[0]===key);
  chain(key,def[2]);
  st.val=val;
  st.gain.gain.setTargetAtTime(val/100*0.7,AC.currentTime,0.3);
  if(key==='rain') updateRainVisual();
}
function setMaster(v){
  audio();
  master.gain.setTargetAtTime(v/100,AC.currentTime,0.1);
}
/* ================= BACKGROUND VIDEO ================= */
const bgVideos=[
  document.getElementById('vidSiang'),
  document.getElementById('vidMalam'),
  document.getElementById('vidHujan')
];
const pendingVideoStarts=new WeakMap();
const videoPauseTimers=new WeakMap();
const BG_FADE_MS=550;
function playBgVideo(video,startAt){
  if(document.hidden||!video.classList.contains('on')) return;
  if(!video.hasAttribute('src')){
    video.src=video.dataset.src;
    video.load();
  }
  const start=()=>{
    pendingVideoStarts.delete(video);
    if(document.hidden||!video.classList.contains('on')) return;
    if(Number.isFinite(startAt)&&Number.isFinite(video.duration)&&video.duration>0){
      try{ video.currentTime=startAt%video.duration; }catch(e){}
    }
    video.play().catch(()=>{});
  };
  if(video.readyState>=1) start();
  else {
    const pending=pendingVideoStarts.get(video);
    if(pending) video.removeEventListener('loadedmetadata',pending);
    pendingVideoStarts.set(video,start);
    video.addEventListener('loadedmetadata',start,{once:true});
  }
}
function activateBgVideo(video,startAt){
  clearTimeout(videoPauseTimers.get(video));
  video.classList.add('on');
  playBgVideo(video,startAt);
}
function deactivateBgVideo(video){
  video.classList.remove('on');
  clearTimeout(videoPauseTimers.get(video));
  videoPauseTimers.set(video,setTimeout(()=>{
    if(!video.classList.contains('on')) video.pause();
  },BG_FADE_MS+50));
}
function updateRainVisual(){
  const v=(ambState.rain&&ambState.rain.val)||0;
  const on=v>0;
  document.getElementById('rainBtn').classList.toggle('active',on);
  const vid=document.getElementById('vidHujan');
  if(!vid) return;
  if(on){
    if(!vid.classList.contains('on')){
      const active=bgVideos.find(el=>el!==vid&&el.classList.contains('on'));
      activateBgVideo(vid,active?active.currentTime:undefined);
    }
  } else {
    deactivateBgVideo(vid);
  }
}
function syncAmbSlider(key,val){
  const el=document.getElementById('amb-'+key);
  if(el) el.value=val;
}
document.getElementById('rainBtn').addEventListener('click',()=>{

  setAmbient('rain',nv);
  syncAmbSlider('rain',nv);

let bgMode='siang';
function setBg(m){
  if(m!=='siang'&&m!=='malam') return;
  const incoming=document.getElementById(m==='siang'?'vidSiang':'vidMalam');
  const outgoing=document.getElementById(m==='siang'?'vidMalam':'vidSiang');

/* ================= FOCUS TIMER ================= */
const tH=document.getElementById('tH'), tM=document.getElementById('tM'), tS=document.getElementById('tS');
const timerDisplay=document.getElementById('timerDisplay'), timerMsg=document.getElementById('timerMsg');
let timerInt=null, timerLeft=0;
function fmt(s){
  s=Math.max(0,s);
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');
}
document.getElementById('setTimer').addEventListener('click',()=>{
  const h=+tH.value||0, m=+tM.value||0, s=+tS.value||0;
  timerLeft=h*3600+m*60+s;
  timerMsg.textContent='';
  if(timerLeft<=0) return;
  clearInterval(timerInt);
  timerDisplay.textContent=fmt(timerLeft);
  timerInt=setInterval(()=>{
    timerLeft--;
    timerDisplay.textContent=fmt(timerLeft);
    if(timerLeft<=0){ clearInterval(timerInt); timerInt=null; timerDone(); }
  },1000);
});
document.getElementById('resetTimer').addEventListener('click',()=>{
  clearInterval(timerInt); timerInt=null; timerLeft=0;
  timerDisplay.textContent='00:00:00'; timerMsg.textContent='';
});
function timerDone(){
  timerMsg.textContent='Waktu habis! Istirahat dulu.';
  audio();
  const t=AC.currentTime;
  [523.25,659.25,783.99].forEach((f,i)=>{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(master);
    env(g,t+i*0.28,0.02,0.25,0.6);
    o.start(t+i*0.28); o.stop(t+i*0.28+1);
  });
}

const todoInput=document.getElementById('todoInput'), todoList=document.getElementById('todoList'), todoEmpty=document.getElementById('todoEmpty');

    if(td.done) li.classList.add('done');
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!!td.done;
    cb.setAttribute('aria-label','Selesai');
    cb.addEventListener('change',()=>{ todos[i].done=cb.checked; saveTodos(); renderTodos(); });
    const sp=document.createElement('span'); sp.textContent=td.text;
    const del=document.createElement('button'); del.className='del'; del.textContent='\u00d7'; del.title='Hapus';

function addTodo(){

}

async function loadMusicList(){
  try{
    const res=await fetch('/api/music');
    if(!res.ok) return;
    const files=await res.json();
    if(!Array.isArray(files) || files.length===0) return;
    MP3_TRACKS=files.map(function(f){ return {t: f.replace(/\.mp3$/i,''), f: f}; });
    if(mp3Idx>=MP3_TRACKS.length) mp3Idx=-1;
    renderMP3List();
    if(mp3Idx<0) setTimeout(tryAutoplay, 100);
  }catch(e){ /* fallback ke daftar bawaan */ }
}
let mp3Idx=-1, mp3Active=false, mp3TriedAlt=false;
const mp3Audio=document.getElementById('mp3Audio');
mp3Audio.volume=0.5;
function mp3SetIcon(paused){
  const btn=document.getElementById('playBtn'), ico=document.getElementById('playIco');
  if(!btn||!ico) return;
  const eq=document.getElementById('nowEq');
  const viz=document.getElementById('homeViz');
  if(paused){ ico.innerHTML='<path d="M8 5v14l11-7z"/>'; btn.classList.remove('playing'); if(eq) eq.classList.remove('on'); if(viz) viz.classList.remove('on'); }
  else { ico.innerHTML='<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>'; btn.classList.add('playing'); if(eq) eq.classList.add('on'); if(viz) viz.classList.add('on'); }
}
function stopMP3(){
  if(!mp3Audio) return;
  try{ mp3Audio.pause(); }catch(e){}
  mp3Audio.removeAttribute('src');
  try{ mp3Audio.load(); }catch(e){}
  if(mp3Active){ mp3Active=false; document.getElementById('songName').textContent=TRACKS[trackIdx].name; }
  mp3SetIcon(true);
  renderMP3List();
}
window.__mp3Stop=stopMP3;
window.__mp3IsActive=function(){ return mp3Active; };
window.__mp3Toggle=function(){
  if(mp3Idx<0){ playMP3(0); return; }
  if(mp3Audio.paused){ mp3Audio.play().catch(function(){}); mp3Active=true; mp3SetIcon(false); }
  else { mp3Audio.pause(); mp3SetIcon(true); }
  renderMP3List();
};
window.__mp3Step=function(d){ playMP3(mp3Idx+d); };
function playMP3(i){
  if(window.__ytStop) window.__ytStop();
  if(playing) setPlaying(false);
  mp3Idx=(i+MP3_TRACKS.length)%MP3_TRACKS.length;
  const tr=MP3_TRACKS[mp3Idx];
  mp3TriedAlt=false;
  mp3Audio.src='music/'+encodeURIComponent(tr.f);
  mp3Audio.play().then(function(){
    mp3Active=true; mp3SetIcon(false);
    document.getElementById('songName').textContent=tr.t;
    document.getElementById('hint').classList.add('hide');
    renderMP3List();
  }).catch(function(){});
  renderMP3List();
}
mp3Audio.addEventListener('ended',function(){ playMP3(mp3Idx+1); });
mp3Audio.addEventListener('error',function(){
  if(!mp3TriedAlt && MP3_TRACKS[mp3Idx] && MP3_TRACKS[mp3Idx].alt){
    mp3TriedAlt=true;
    mp3Audio.src='music/'+encodeURIComponent(MP3_TRACKS[mp3Idx].alt);
    mp3Audio.play().catch(function(){});
    return;
  }
  mp3Active=false; mp3SetIcon(true);
  document.getElementById('songName').textContent='MP3 tidak ditemukan: '+MP3_TRACKS[mp3Idx].t;
  const st=document.getElementById('mp3Status');
  if(st) st.textContent='File tidak ditemukan di folder music/. Pastikan 25 file MP3 ada di folder music/ di sebelah file HTML ini, dengan nama yang sama.';
  renderMP3List();
});
function renderMP3List(){
  function renderInto(ulId, items, offset){
    const ul=document.getElementById(ulId); if(!ul) return; ul.innerHTML='';
    items.forEach(function(tr,k){
      const idx=offset+k;
      const li=document.createElement('li');
      if(mp3Active && idx===mp3Idx) li.classList.add('on');
      const n=document.createElement('span'); n.className='num'; n.textContent=idx+1;
      const tt=document.createElement('span'); tt.className='ttl'; tt.textContent=tr.t;
      li.appendChild(n); li.appendChild(tt);
      li.addEventListener('click',function(){ playMP3(idx); });
      ul.appendChild(li);
    });
  }
  renderInto('mpList', MP3_TRACKS.slice(0,15), 0);
  renderInto('mpList2', MP3_TRACKS.slice(15), 15);
}
document.getElementById('masterVol').addEventListener('input',function(e){ mp3Audio.volume=(+e.target.value||50)/100; });

function unlockOnGesture(){
  if(!mp3Active){ try{ playMP3(mp3Idx<0?0:mp3Idx); }catch(e){} }

}
